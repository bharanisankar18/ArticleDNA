<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="ArticleDNA architecture: the Chrome side panel sends article text to the ArticleDNA server, which asks Gemini, Groq, OpenRouter or Ollama in turn, verifies the answer against the article, and returns it to the panel.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.5 L9 5 L1 8.5 z" fill="#3B3F4E"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.5 L9 5 L1 8.5 z" fill="#4D57E6"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#090D1A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="470" rx="24" fill="#F4F3E2"/>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <!-- ======================= zones ======================= -->
    <rect x="20" y="20" width="300" height="430" rx="18" fill="#FBFAF3" stroke="#DCD9B8"/>
    <rect x="400" y="20" width="290" height="430" rx="18" fill="#FBFAF3" stroke="#DCD9B8"/>
    <rect x="770" y="20" width="210" height="430" rx="18" fill="#FBFAF3" stroke="#DCD9B8"/>

    <text x="40" y="54" font-size="16" font-weight="700" fill="#090D1A">Chrome</text>
    <text x="40" y="74" font-size="12.5" fill="#5F6276">Runs on your computer</text>
    <text x="420" y="54" font-size="16" font-weight="700" fill="#090D1A">ArticleDNA server</text>
    <text x="420" y="74" font-size="12.5" fill="#5F6276">Python · FastAPI</text>
    <text x="790" y="54" font-size="16" font-weight="700" fill="#090D1A">AI providers</text>
    <text x="790" y="74" font-size="12.5" fill="#5F6276">Tried in order</text>

    <!-- ======================= browser ======================= -->
    <g filter="url(#shadow)">
      <rect x="40" y="100" width="260" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
      <rect x="40" y="186" width="260" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
      <rect x="40" y="272" width="260" height="60" rx="12" fill="#090D1A"/>
      <rect x="40" y="358" width="260" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
    </g>
    <text x="58" y="125" font-size="14.5" font-weight="700" fill="#090D1A">Article page</text>
    <text x="58" y="145" font-size="12.5" fill="#5F6276">Paper, news or blog</text>
    <text x="58" y="211" font-size="14.5" font-weight="700" fill="#090D1A">Content script</text>
    <text x="58" y="231" font-size="12.5" fill="#5F6276">Extracts text, highlights passages</text>
    <text x="58" y="297" font-size="14.5" font-weight="700" fill="#ECEBCB">Side panel</text>
    <text x="58" y="317" font-size="12.5" fill="#B9BCD0">React app: Analyze, Visualize</text>
    <text x="58" y="383" font-size="14.5" font-weight="700" fill="#090D1A">Local storage</text>
    <text x="58" y="403" font-size="12.5" fill="#5F6276">Saved and History</text>

    <g stroke="#3B3F4E" stroke-width="1.6" fill="none">
      <path d="M170 162 V184" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M170 248 V270" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M170 334 V356" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>

    <!-- ======================= server ======================= -->
    <g filter="url(#shadow)">
      <rect x="420" y="100" width="250" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
      <rect x="420" y="186" width="250" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
      <rect x="420" y="272" width="250" height="60" rx="12" fill="#E3E3F3" stroke="#4D57E6"/>
    </g>
    <rect x="420" y="358" width="250" height="60" rx="12" fill="none" stroke="#9A9C8A" stroke-dasharray="5 4"/>
    <text x="438" y="125" font-size="14.5" font-weight="700" fill="#090D1A">API</text>
    <text x="438" y="145" font-size="12.5" fill="#5F6276">/api/analyze · /api/visualize</text>
    <text x="438" y="211" font-size="14.5" font-weight="700" fill="#090D1A">Provider router</text>
    <text x="438" y="231" font-size="12.5" fill="#5F6276">Automatic fallback and cooldowns</text>
    <text x="438" y="297" font-size="14.5" font-weight="700" fill="#3540C2">Grounding check</text>
    <text x="438" y="317" font-size="12.5" fill="#3B3F4E">Keeps only what the article supports</text>
    <text x="438" y="383" font-size="14.5" font-weight="700" fill="#3B3F4E">API keys</text>
    <text x="438" y="403" font-size="12.5" fill="#5F6276">Stay in .env, never in the browser</text>

    <path d="M545 162 V182" stroke="#3B3F4E" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <!-- ======================= providers ======================= -->
    <path d="M808 130 V388" stroke="#CBC8A2" stroke-width="2" stroke-dasharray="3 5"/>
    <g filter="url(#shadow)">
      <rect x="790" y="100" width="170" height="60" rx="12" fill="#4D57E6"/>
      <rect x="790" y="186" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
      <rect x="790" y="272" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
      <rect x="790" y="358" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#CBC8A2"/>
    </g>
    <g font-size="11" font-weight="700" text-anchor="middle">
      <circle cx="812" cy="130" r="11" fill="#FFFFFF"/><text x="812" y="134" fill="#4D57E6">1</text>
      <circle cx="812" cy="216" r="11" fill="#090D1A"/><text x="812" y="220" fill="#ECEBCB">2</text>
      <circle cx="812" cy="302" r="11" fill="#090D1A"/><text x="812" y="306" fill="#ECEBCB">3</text>
      <circle cx="812" cy="388" r="11" fill="#090D1A"/><text x="812" y="392" fill="#ECEBCB">4</text>
    </g>
    <text x="832" y="125" font-size="14.5" font-weight="700" fill="#FFFFFF">Gemini</text>
    <text x="832" y="145" font-size="12.5" fill="#D9DBFA">Primary</text>
    <text x="832" y="211" font-size="14.5" font-weight="700" fill="#090D1A">Groq</text>
    <text x="832" y="231" font-size="12.5" fill="#5F6276">Fast open models</text>
    <text x="832" y="297" font-size="14.5" font-weight="700" fill="#090D1A">OpenRouter</text>
    <text x="832" y="317" font-size="12.5" fill="#5F6276">Free models</text>
    <text x="832" y="383" font-size="14.5" font-weight="700" fill="#090D1A">Ollama</text>
    <text x="832" y="403" font-size="12.5" fill="#5F6276">Local, unlimited</text>

    <!-- ======================= flows ======================= -->
    <!-- request: side panel -> API -->
    <path d="M302 288 H360 V130 H416" stroke="#4D57E6" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/>
    <!-- response: grounding -> side panel -->
    <path d="M418 316 H304" stroke="#3B3F4E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <!-- prompt: router -> providers -->
    <path d="M672 216 H730 V130 H786" stroke="#4D57E6" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/>
    <!-- answer: providers -> grounding -->
    <path d="M768 302 H674" stroke="#3B3F4E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <g font-size="11" font-weight="600" text-anchor="middle">
      <rect x="331" y="190" width="58" height="34" rx="8" fill="#FFFFFF" stroke="#4D57E6"/>
      <text x="360" y="204" fill="#3540C2">Article</text>
      <text x="360" y="217" fill="#3540C2">text</text>
      <rect x="331" y="330" width="58" height="34" rx="8" fill="#FFFFFF" stroke="#3B3F4E"/>
      <text x="360" y="344" fill="#3B3F4E">Verified</text>
      <text x="360" y="357" fill="#3B3F4E">analysis</text>
      <rect x="701" y="156" width="58" height="22" rx="8" fill="#FFFFFF" stroke="#4D57E6"/>
      <text x="730" y="171" fill="#3540C2">Prompt</text>
      <rect x="701" y="316" width="58" height="22" rx="8" fill="#FFFFFF" stroke="#3B3F4E"/>
      <text x="730" y="331" fill="#3B3F4E">JSON</text>
    </g>
  </g>
</svg>
